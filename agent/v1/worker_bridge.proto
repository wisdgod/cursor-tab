syntax = "proto3";

package agent.v1;

message Frame {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_REQUEST = 1;
    KIND_RESPONSE = 2;
    KIND_ERROR = 3;
  }
  string id = 1;
  string method = 2;
  bytes data = 3;
  Kind kind = 4;
  string error = 5;
}

service PrivateWorkerBridgeExternalService {
  rpc Connect(stream Frame) returns (stream Frame);
}
