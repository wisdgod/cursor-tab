syntax = "proto3";

package agent.v1;

import "agent/v1/agent.proto";
import "aiserver/v1/utils.proto";

enum SubagentInteractionPolicy {
  SUBAGENT_INTERACTION_POLICY_UNSPECIFIED = 0;
  SUBAGENT_INTERACTION_POLICY_AUTO_REJECT = 1;
  SUBAGENT_INTERACTION_POLICY_BUBBLE_TO_PARENT = 2;
  SUBAGENT_INTERACTION_POLICY_SURFACE_TO_USER = 3;
}

enum AgentHostSessionStatus {
  AGENT_HOST_SESSION_STATUS_UNSPECIFIED = 0;
  AGENT_HOST_SESSION_STATUS_IDLE = 1;
  AGENT_HOST_SESSION_STATUS_RUNNING = 2;
  AGENT_HOST_SESSION_STATUS_AWAITING_INPUT = 3;
}

enum AgentHostInteractionResponseStatus {
  AGENT_HOST_INTERACTION_RESPONSE_STATUS_UNSPECIFIED = 0;
  AGENT_HOST_INTERACTION_RESPONSE_STATUS_ACCEPTED = 1;
  AGENT_HOST_INTERACTION_RESPONSE_STATUS_ALREADY_RESOLVED = 2;
  AGENT_HOST_INTERACTION_RESPONSE_STATUS_NOT_FOUND = 3;
}

enum AgentHostBackgroundWorkKind {
  AGENT_HOST_BACKGROUND_WORK_KIND_UNSPECIFIED = 0;
  AGENT_HOST_BACKGROUND_WORK_KIND_SHELL = 1;
  AGENT_HOST_BACKGROUND_WORK_KIND_SUBAGENT = 2;
}

enum AgentHostBackgroundWorkState {
  AGENT_HOST_BACKGROUND_WORK_STATE_UNSPECIFIED = 0;
  AGENT_HOST_BACKGROUND_WORK_STATE_RUNNING = 1;
  AGENT_HOST_BACKGROUND_WORK_STATE_QUEUED = 2;
}

enum AgentHostTurnOutcome {
  AGENT_HOST_TURN_OUTCOME_UNSPECIFIED = 0;
  AGENT_HOST_TURN_OUTCOME_COMPLETED = 1;
  AGENT_HOST_TURN_OUTCOME_INTERRUPTED = 2;
  AGENT_HOST_TURN_OUTCOME_FAILED = 3;
}

message CreateAgentHostSessionRequest {
  string session_id = 1;
  optional ConversationStateStructure initial_history = 2;
  optional AgentHostSessionOptions session_options = 3;
}

message AgentHostSessionOptions {
  repeated string workspace_paths = 1;
  optional string worktree_main_path = 2;
  optional bool is_glass_root = 3;
  optional SubagentInteractionPolicy interaction_policy = 4;
}

message CreateAgentHostSessionResponse {
}

message ForkAgentHostSessionRequest {
  string session_id = 1;
  optional string last_turn_id = 2;
}

message ForkAgentHostSessionResponse {
  string session_id = 1;
}

message ListAgentHostSessionsRequest {
  optional bool include_children = 1;
  optional string parent_session_id = 2;
}

message ListAgentHostSessionsResponse {
  repeated AgentHostSession sessions = 1;
}

message WatchAgentHostSessionsRequest {
}

message SessionParent {
  string parent_session_id = 1;
  string parent_tool_call_id = 2;
  string root_session_id = 3;
}

message AgentHostSession {
  string session_id = 1;
  AgentHostSessionStatus status = 2;
  uint64 last_event_id = 3;
  optional string forked_from_session_id = 4;
  optional SessionParent parent = 5;
}

message WatchAgentHostSessionsEvent {
  oneof event {
    AgentHostSessionsSnapshot snapshot = 1;
    AgentHostSessionAdded added = 2;
    AgentHostSessionUpdated updated = 3;
    AgentHostSessionDeleted deleted = 4;
  }
}

message AgentHostSessionsSnapshot {
  repeated AgentHostSession sessions = 1;
}

message AgentHostSessionAdded {
  AgentHostSession session = 1;
}

message AgentHostSessionUpdated {
  AgentHostSession session = 1;
}

message AgentHostSessionDeleted {
  string session_id = 1;
}

message SendAgentHostMessageRequest {
  string session_id = 1;
  string text = 2;
  optional string model_id = 3;
  optional ModelDetails model_details = 4;
  optional AgentHostTurnOptions turn_options = 5;
  optional RequestedModel requested_model = 6;
}

message SendAgentHostActionRequest {
  string session_id = 1;
  ConversationAction action = 2;
  optional string model_id = 3;
  optional ModelDetails model_details = 4;
  optional AgentHostTurnOptions turn_options = 5;
  optional RequestedModel requested_model = 6;
  optional ConversationStateStructure base_history = 7;
}

message SendAgentHostMessageResponse {
  string turn_id = 1;
}

message SendAgentHostActionResponse {
  string turn_id = 1;
}

message DeleteAgentHostSessionRequest {
  string session_id = 1;
}

message DeleteAgentHostSessionResponse {
}

message InterruptAgentHostTurnRequest {
  string session_id = 1;
  string turn_id = 2;
  optional string reason = 3;
}

message InterruptAgentHostTurnResponse {
  bool interrupted = 1;
}

message CancelQueuedAgentHostTurnRequest {
  string session_id = 1;
  string turn_id = 2;
  optional string reason = 3;
}

message CancelQueuedAgentHostTurnResponse {
  bool cancelled = 1;
}

message RespondToAgentHostInteractionRequest {
  string session_id = 1;
  string interaction_id = 2;
  InteractionResponse response = 3;
}

message RespondToAgentHostInteractionResponse {
  AgentHostInteractionResponseStatus status = 1;
}

message AgentHostPendingInteraction {
  string interaction_id = 1;
  string turn_id = 2;
  InteractionQuery query = 3;
}

message WatchAgentHostSessionInteractionsRequest {
  string session_id = 1;
}

message WatchAgentHostSessionInteractionsEvent {
  oneof event {
    AgentHostSessionInteractionsSnapshot snapshot = 1;
    AgentHostSessionInteractionsState state = 2;
  }
}

message AgentHostSessionInteractionsSnapshot {
  repeated AgentHostPendingInteraction interactions = 1;
}

message AgentHostSessionInteractionsState {
  repeated AgentHostPendingInteraction interactions = 1;
}

message AgentHostBackgroundWork {
  string id = 1;
  AgentHostBackgroundWorkKind kind = 2;
  AgentHostBackgroundWorkState state = 3;
  optional string owner_id = 4;
  bool has_abort = 5;
  map<string, string> metadata = 6;
}

message WatchAgentHostSessionBackgroundWorkRequest {
  string session_id = 1;
  optional AgentHostBackgroundWorkKind kind = 2;
  optional AgentHostBackgroundWorkState state = 3;
  optional string owner_id = 4;
}

message WatchAgentHostSessionBackgroundWorkEvent {
  oneof event {
    AgentHostSessionBackgroundWorkSnapshot snapshot = 1;
    AgentHostSessionBackgroundWorkState state = 2;
  }
}

message WatchAgentHostSessionTurnLifecycleRequest {
  string session_id = 1;
}

message WatchAgentHostSessionTurnLifecycleEvent {
  oneof event {
    AgentHostTurnLifecycleWatchReady ready = 1;
    AgentHostTurnLifecycle lifecycle = 2;
  }
}

message AgentHostTurnLifecycleWatchReady {
}

message AgentHostSessionBackgroundWorkSnapshot {
  repeated AgentHostBackgroundWork work = 1;
}

message AgentHostSessionBackgroundWorkState {
  repeated AgentHostBackgroundWork work = 1;
}

message AbortAgentHostBackgroundWorkRequest {
  string session_id = 1;
  string work_id = 2;
}

message AbortAgentHostBackgroundWorkResponse {
  bool aborted = 1;
}

message AbortAllAgentHostBackgroundWorkRequest {
  string session_id = 1;
  optional AgentHostBackgroundWorkKind kind = 2;
  optional AgentHostBackgroundWorkState state = 3;
  optional string owner_id = 4;
}

message AbortAllAgentHostBackgroundWorkResponse {
  uint32 aborted_count = 1;
}

message AttachAgentHostSessionRequest {
  string session_id = 1;
  optional uint64 last_event_id = 2;
  optional bool background_task_completions_only = 3;
}

message AgentHostSessionEvent {
  uint64 event_id = 1;
  oneof event {
    InteractionUpdate interaction_update = 2;
    ConversationStateStructure conversation_state = 3;
    AgentHostTurnStarted turn_started = 4;
    AgentHostTurnAwaitingInput turn_awaiting_input = 8;
    AgentHostTurnSettled turn_settled = 9;
    AgentHostInteractionResolved interaction_resolved = 10;
    AgentHostSubagentStarted subagent_started = 11;
    AgentHostBackgroundTaskCompleted background_task_completed = 12;
  }
}

message AgentHostBackgroundTaskCompleted {
  BackgroundTaskCompletion completion = 1;
}

message AgentHostTurnLifecycle {
  string turn_id = 1;
  oneof event {
    AgentHostNetworkPhaseStarted network_phase_started = 2;
    AgentHostResponseMetadata response_metadata = 3;
    AgentHostConnectionStateChanged connection_state_changed = 4;
    AgentHostFirstMessage first_message = 5;
    AgentHostFirstMessageNetwork first_message_network = 6;
    AgentHostFirstNonHeartbeatResponse first_non_heartbeat_response = 7;
    AgentHostTtftBreakdown ttft_breakdown = 8;
    AgentHostTurnLifecycleFinished finished = 9;
  }
}

message AgentHostTurnLifecycleFinished {
}

message AgentHostNetworkPhaseStarted {
}

message AgentHostResponseMetadata {
  optional string server_region = 1;
  optional string transport_mode = 2;
}

message AgentHostReconnectTrigger {
  optional string error_class = 1;
  optional uint32 connect_code = 2;
  optional string connect_code_name = 3;
  optional uint32 error_code = 4;
  optional bool count_as_server_error = 5;
  optional bool count_as_transport_error = 6;
  optional bool stall_aborted = 7;
  optional string originating_request_id = 8;
  optional string attempt_request_id = 9;
  optional string endpoint_url = 10;
}

message AgentHostConnectionStateChanged {
  oneof state {
    AgentHostConnected connected = 1;
    AgentHostReconnecting reconnecting = 2;
  }
}

message AgentHostConnected {
}

message AgentHostReconnecting {
  uint32 attempt = 1;
  optional AgentHostReconnectTrigger trigger = 2;
}

message AgentHostFirstMessage {
  double elapsed_ms = 1;
}

message AgentHostFirstMessageNetwork {
  double elapsed_ms = 1;
}

message AgentHostFirstNonHeartbeatResponse {
  double handshake_ms = 1;
  uint32 attempt = 2;
}

message AgentHostTtftBreakdown {
  double server_first_token_ms = 1;
  double pre_stream_setup_ms = 2;
  double wait_for_first_event_ms = 3;
  optional double provider_ttft_ms = 4;
  double slow_pool_wait_ms = 5;
  uint32 attempt = 6;
}

message AgentHostSubagentStarted {
  string turn_id = 1;
  string parent_tool_call_id = 2;
  string child_session_id = 3;
  string root_session_id = 4;
}

message AgentHostTurnStarted {
  string turn_id = 1;
}

message AgentHostTurnAwaitingInput {
  string turn_id = 1;
  string request_id = 2;
  string interaction_id = 3;
  InteractionQuery query = 4;
}

message AgentHostInteractionCancelled {
  optional string reason = 1;
}

message AgentHostInteractionFailed {
  string error = 1;
}

message AgentHostInteractionResolved {
  string turn_id = 1;
  string interaction_id = 2;
  oneof resolution {
    InteractionResponse responded = 3;
    AgentHostInteractionCancelled cancelled = 4;
    AgentHostInteractionFailed failed = 5;
  }
}

message AgentHostTurnSettled {
  string turn_id = 1;
  AgentHostTurnOutcome outcome = 2;
  optional string detail = 3;
  optional AgentHostTurnError error = 4;
}

message AgentHostTurnError {
  optional string kind = 1;
  optional string title = 2;
  optional string detail = 3;
  optional bool is_retryable = 4;
  optional uint32 connect_code = 5;
  optional string inference_request_error_type = 6;
  optional string request_id = 7;
  optional aiserver.v1.ErrorDetails error_details = 8;
}

message AgentHostTurnOptions {
  optional string generation_uuid = 1;
  optional string custom_system_prompt = 2;
  optional bool exclude_workspace_context = 3;
  optional bool enable_agent_retries = 4;
  optional uint32 fixed_retry_delay_ms = 5;
  optional bool endless_retries = 6;
  optional string agent_session_id = 7;
  optional bool is_running_in_test = 8;
  optional uint32 stall_advisory_timeout_ms = 9;
  optional uint32 stall_fail_timeout_ms = 10;
}

service AgentHostService {
  rpc CreateSession(CreateAgentHostSessionRequest) returns (CreateAgentHostSessionResponse);
  rpc ForkSession(ForkAgentHostSessionRequest) returns (ForkAgentHostSessionResponse);
  rpc ListSessions(ListAgentHostSessionsRequest) returns (ListAgentHostSessionsResponse);
  rpc WatchSessions(WatchAgentHostSessionsRequest) returns (stream WatchAgentHostSessionsEvent);
  rpc SendMessage(SendAgentHostMessageRequest) returns (SendAgentHostMessageResponse);
  rpc SendAction(SendAgentHostActionRequest) returns (SendAgentHostActionResponse);
  rpc DeleteSession(DeleteAgentHostSessionRequest) returns (DeleteAgentHostSessionResponse);
  rpc InterruptTurn(InterruptAgentHostTurnRequest) returns (InterruptAgentHostTurnResponse);
  rpc CancelQueuedTurn(CancelQueuedAgentHostTurnRequest) returns (CancelQueuedAgentHostTurnResponse);
  rpc RespondToInteraction(RespondToAgentHostInteractionRequest) returns (RespondToAgentHostInteractionResponse);
  rpc WatchSessionInteractions(WatchAgentHostSessionInteractionsRequest) returns (stream WatchAgentHostSessionInteractionsEvent);
  rpc WatchSessionBackgroundWork(WatchAgentHostSessionBackgroundWorkRequest) returns (stream WatchAgentHostSessionBackgroundWorkEvent);
  rpc WatchSessionTurnLifecycle(WatchAgentHostSessionTurnLifecycleRequest) returns (stream WatchAgentHostSessionTurnLifecycleEvent);
  rpc AbortBackgroundWork(AbortAgentHostBackgroundWorkRequest) returns (AbortAgentHostBackgroundWorkResponse);
  rpc AbortAllBackgroundWork(AbortAllAgentHostBackgroundWorkRequest) returns (AbortAllAgentHostBackgroundWorkResponse);
  rpc AttachSession(AttachAgentHostSessionRequest) returns (stream AgentHostSessionEvent);
}
