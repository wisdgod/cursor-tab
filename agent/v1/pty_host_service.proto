syntax = "proto3";

package agent.v1;

message Process {
  string shell = 1;
  repeated string args = 2;
}

message SpawnPtyRequest {
  optional Process process = 1;
  string cwd = 2;
  map<string, string> env = 3;
  uint32 cols = 4;
  uint32 rows = 5;
}

message SpawnPtyResponse {
  string pty_id = 1;
}

message AttachPtyRequest {
  string pty_id = 1;
  optional string last_event_id = 2;
}

message PtyEvent {
  string event_id = 1;
  oneof data {
    PtyData pty_data = 2;
    PtyExited pty_exited = 3;
  }
}

message PtyData {
  bytes data = 1;
}

message PtyExited {
  int32 exit_code = 1;
  optional int32 signal = 2;
}

message SendInputRequest {
  string pty_id = 1;
  bytes data = 2;
}

message SendInputResponse {
  bool success = 1;
}

message ResizePtyRequest {
  string pty_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ResizePtyResponse {
  bool success = 1;
}

message ListPtysRequest {
}

message ListPtysResponse {
  repeated PtyInfo ptys = 1;
}

message PtyInfo {
  string pty_id = 1;
  string shell = 2;
  string cwd = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  int32 pid = 6;
  repeated string process_args = 7;
}

message TerminatePtyRequest {
  string pty_id = 1;
}

message TerminatePtyResponse {
  bool success = 1;
}

service PtyHostService {
  rpc SpawnPty(SpawnPtyRequest) returns (SpawnPtyResponse);
  rpc AttachPty(AttachPtyRequest) returns (stream PtyEvent);
  rpc SendInput(SendInputRequest) returns (SendInputResponse);
  rpc ResizePty(ResizePtyRequest) returns (ResizePtyResponse);
  rpc ListPtys(ListPtysRequest) returns (ListPtysResponse);
  rpc TerminatePty(TerminatePtyRequest) returns (TerminatePtyResponse);
}
