message SubscriptionEventDisplay {
  optional string display_label = 1;
  optional string resource_url = 2;
  optional string subscription_id = 3;
}

message UserDisplayInfo {
  int32 user_id = 1;
  optional string display_name = 2;
  optional string email = 3;
  optional string profile_picture_url = 4;
}

message ExecutePlanInfo {
  string plan_id = 1;
  string plan_title = 2;
