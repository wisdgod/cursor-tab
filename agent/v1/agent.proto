enum SimulatedMsgReason {
  SIMULATED_MSG_REASON_UNSPECIFIED = 0;
  SIMULATED_MSG_REASON_PLAN_EXECUTION = 1;
  SIMULATED_MSG_REASON_COMMIT_REMINDER = 2;
