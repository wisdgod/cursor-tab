syntax = "proto3";

package agent.v1;

message Empty {
}

message ClaimWorkerRequest {
  string http_mcp_config_json = 1;
  string mcp_config_json = 2;
  string bc_id = 3;
}

message ReleaseWorkerRequest {
}

service LifecycleService {
  rpc ResetInstance(Empty) returns (Empty);
  rpc RenewInstance(Empty) returns (Empty);
  rpc ClaimWorker(ClaimWorkerRequest) returns (Empty);
  rpc ReleaseWorker(ReleaseWorkerRequest) returns (Empty);
}
