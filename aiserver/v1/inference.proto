syntax = "proto3";

package aiserver.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

enum InferenceMessageRole {
  INFERENCE_MESSAGE_ROLE_UNSPECIFIED = 0;
  INFERENCE_MESSAGE_ROLE_USER = 1;
  INFERENCE_MESSAGE_ROLE_ASSISTANT = 2;
  INFERENCE_MESSAGE_ROLE_TOOL = 3;
  INFERENCE_MESSAGE_ROLE_SYSTEM = 4;
}

enum InferenceStreamErrorType {
  INFERENCE_STREAM_ERROR_TYPE_UNSPECIFIED = 0;
  INFERENCE_STREAM_ERROR_TYPE_UNKNOWN = 1;
  INFERENCE_STREAM_ERROR_TYPE_INPUT_TOKEN_LIMIT = 2;
  INFERENCE_STREAM_ERROR_TYPE_OUTPUT_TOKEN_LIMIT = 3;
  INFERENCE_STREAM_ERROR_TYPE_RATE_LIMIT = 4;
  INFERENCE_STREAM_ERROR_TYPE_AUTHENTICATION = 5;
  INFERENCE_STREAM_ERROR_TYPE_PERMISSION = 6;
  INFERENCE_STREAM_ERROR_TYPE_OVERLOADED = 7;
  INFERENCE_STREAM_ERROR_TYPE_CONTENT_FILTER = 8;
}

message AgentFollowupCategorizationRequest {
  string request_id = 1;
  string replying_to_request_id = 2;
  repeated InferenceCoreMessage messages = 3;
  optional string conversation_id = 4;
  optional string agent_mode = 5;
  optional string model_name = 6;
}

message InferenceAgentTool {
  string name = 1;
  string description = 2;
  google.protobuf.Struct parameters = 3;
  optional InferenceCustomToolFormat custom_tool_format = 4;
}

message InferenceAnthropicOptions {
  optional InferenceCacheControl cache_control = 1;
}

message InferenceCacheControl {
  string type = 1;
}

message InferenceContentPart {
  oneof part {
    InferenceTextPart text = 1;
    InferenceImagePart image = 2;
    InferenceFilePart file = 3;
  }
}

message InferenceContentParts {
  repeated InferenceContentPart parts = 1;
}

message InferenceCoreMessage {
  InferenceMessageRole role = 1;
  oneof content {
    string text = 2;
    InferenceContentParts parts = 3;
    InferenceToolResultContent tool_content = 6;
  }
  repeated InferenceToolCall tool_calls = 4;
}

message InferenceCustomToolFormat {
  string type = 1;
  string definition = 2;
  string syntax = 3;
}

message InferenceExtendedUsageInfo {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cache_read_tokens = 3;
  int32 cache_write_tokens = 4;
  int32 max_tokens = 5;
}

message InferenceExtraData {
  repeated InferenceTokenLogprobs token_logprobs = 1;
  repeated InferenceTokenIds token_ids = 2;
  repeated InferenceTokenIds prompt_token_ids = 3;
  repeated InferenceTokenIds extra_tokens = 4;
  repeated InferenceTokenLogprobs extra_logprobs = 5;
  repeated InferenceRoutingRow routing_matrix = 6;
}

message InferenceFilePart {
  string data = 1;
  string media_type = 2;
  optional string filename = 3;
  optional InferenceProviderOptions provider_options = 4;
}

message InferenceImagePart {
  string data = 1;
  optional string mime_type = 2;
  optional InferenceProviderOptions provider_options = 3;
}

message InferenceInvocationIdInfo {
  string invocation_id = 1;
}

message InferenceModelConfig {
  optional int32 max_tokens = 1;
  optional float temperature = 2;
  optional float top_p = 3;
  repeated string stop_sequences = 4;
}

message InferenceModelParameterValue {
  string id = 1;
  string value = 2;
}

message InferenceNamedProviderDefinedTool {
  string name = 1;
  string id = 2;
  string type = 3;
  google.protobuf.Struct options = 4;
}

message InferenceProviderMetadataInfo {
  google.protobuf.Struct metadata = 1;
}

message InferenceProviderOptions {
  optional InferenceAnthropicOptions anthropic = 1;
}

message InferenceRequestedModel {
  string model_id = 1;
  bool max_mode = 2;
  repeated InferenceModelParameterValue parameters = 3;
  bool built_in_model = 4;
  bool is_variant_string_representation = 5;
}

message InferenceResponseInfo {
  string id = 1;
  string model = 2;
  int64 created_at = 3;
  repeated InferenceResponseMessage messages = 4;
  optional string error_message = 5;
  optional InferenceExtraData inference_extra_data = 6;
}

message InferenceResponseMessage {
  string id = 1;
  InferenceMessageRole role = 2;
  optional string content = 3;
  repeated InferenceToolCall tool_calls = 4;
  optional InferenceToolResultContent tool_result = 5;
}

message InferenceRoutingRow {
  repeated string values = 1;
}

message InferenceStreamError {
  string message = 1;
  string code = 2;
  bool is_input_token_limit_error = 3;
  bool is_output_token_limit_error = 4;
  InferenceStreamErrorType error_type = 5;
}

message InferenceStreamRequest {
  repeated InferenceCoreMessage messages = 1;
  repeated InferenceAgentTool tools = 2;
  repeated InferenceNamedProviderDefinedTool provider_defined_tools = 3;
  optional InferenceModelConfig model_config = 4;
  optional string model_id = 5;
  optional string invocation_id = 6;
  optional InferenceRequestedModel requested_model = 7;
  optional string conversation_id = 8;
}

message InferenceStreamResponse {
  oneof response {
    InferenceTextStreamPart text_part = 1;
    InferenceToolCallStreamPart tool_call_part = 2;
    InferenceUsageInfo usage = 3;
    InferenceResponseInfo response_info = 4;
    InferenceExtendedUsageInfo extended_usage = 5;
    InferenceProviderMetadataInfo provider_metadata = 6;
    InferenceInvocationIdInfo invocation_id = 7;
    InferenceStreamError error = 8;
    InferenceThinkingStreamPart thinking_part = 9;
  }
}

message InferenceTextPart {
  string text = 1;
  optional InferenceProviderOptions provider_options = 2;
}

message InferenceTextStreamPart {
  string text = 1;
  bool is_final = 2;
}

message InferenceThinkingStreamPart {
  string text = 1;
  optional string signature = 2;
  bool is_final = 3;
}

message InferenceTokenIds {
  repeated int64 values = 1;
}

message InferenceTokenLogprobs {
  repeated double values = 1;
}

message InferenceToolCall {
  string tool_call_id = 1;
  string tool_name = 2;
  google.protobuf.Struct args = 3;
}

message InferenceToolCallStreamPart {
  string tool_call_id = 1;
  string tool_name = 2;
  string args = 3;
  bool is_complete = 4;
  optional int32 tool_index = 5;
}

message InferenceToolResultContent {
  repeated InferenceToolResultPart parts = 1;
}

message InferenceToolResultPart {
  string tool_call_id = 1;
  string tool_name = 2;
  google.protobuf.Value result = 3;
  bool is_error = 4;
}

message InferenceUsageInfo {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  optional int32 total_tokens = 3;
}

service InferenceService {
  rpc Stream (InferenceStreamRequest) returns (stream InferenceStreamResponse);
  rpc RecordAgentFollowupClassification (AgentFollowupCategorizationRequest) returns (google.protobuf.Empty);
}
