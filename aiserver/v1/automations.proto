message ListAllRunsRequest {
  optional string automation_id = 1;
  optional int32 limit = 2;
  optional string cursor = 3;
  AutomationRunListKind run_kind = 4;
  optional int32 team_id = 5;
  bool owner_only = 6;
}

message ListAllRunsResponse {
  repeated AutomationRun runs = 1;
  optional string next_cursor = 2;
}

message TestAutomationFilterRequest {
  string automation_id = 1;
  optional int32 trigger_index = 11;
  optional string test_repo = 12;
  optional string test_branch = 13;
  oneof sample_payload {
    CronSamplePayload cron = 2;
    PullRequestSamplePayload pull_request = 3;
    PushSamplePayload push = 4;
    SlackSamplePayload slack = 5;
    LinearSamplePayload linear = 6;
    CICompletedSamplePayload ci_completed = 7;
    WebhookSamplePayload webhook = 8;
    SlackChannelCreatedSamplePayload slack_channel_created = 9;
    PagerDutySamplePayload pagerduty = 10;
    SentrySamplePayload sentry = 15;
    MicrosoftTeamsSamplePayload microsoft_teams = 16;
    MicrosoftTeamsChannelCreatedSamplePayload microsoft_teams_channel_created = 17;
    SlackReactionAddedSamplePayload slack_reaction_added = 18;
  }
}

message TestAutomationFilterResponse {
  AutomationFilterDecision decision = 1;
  optional string rationale = 2;
  optional string error_message = 3;
}

message ListAutomationMemoriesRequest {
  string automation_id = 1;
}

message ListAutomationMemoriesResponse {
  repeated string files = 1;
}

message GetAutomationMemoryRequest {
  string automation_id = 1;
  string file = 2;
}

message GetAutomationMemoryResponse {
  string file = 1;
  string content = 2;
  bool exists = 3;
  optional string version = 4;
}

message UpdateAutomationMemoryRequest {
  string automation_id = 1;
  string file = 2;
  string content = 3;
  oneof expected {
    string expected_version = 4;
    bool expect_missing = 5;
  }
}

message UpdateAutomationMemoryResponse {
  string file = 1;
  string content = 2;
  optional string version = 3;
  bool conflict = 4;
}

message AutomationRunFailureDetails {
  AutomationRunFailureCode code = 1;
  string title = 2;
  string message = 3;
  optional string cta_label = 4;
  optional string cta_path = 5;
}

message AutomationRun {
  string background_composer_id = 3;
  string namespaced_workflow_id = 4;
  Workflow workflow = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  optional PlatformActionsPayload platform_actions = 8;
  optional TriggerMetadataPayload trigger_metadata = 9;
  string uuid = 10;
  string automation_id = 11;
  AutomationRunStatus status = 12;
  string error_message = 13;
  optional AutomationRunFailureDetails failure_details = 14;
  optional int64 completed_at = 15;
  optional AutomationFilterDecision filter_decision = 16;
  optional string filter_rationale = 17;
  optional string filter_error_message = 18;
  bool can_retry = 19;
  optional string retry_ineligible_reason = 20;
  optional AutomationRunRetryIneligibleReason retry_ineligible_reason_code = 21;
}

message GetRunSummaryRequest {
  optional string automation_id = 1;
  optional int32 team_id = 2;
  bool owner_only = 3;
}

message GetRunSummaryResponse {
  repeated RunSummaryWindow windows = 1;
  repeated HistogramBucket histogram = 2;
}

message RunSummaryWindow {
  string key = 1;
  int32 succeeded = 2;
  int32 failed = 3;
}

message HistogramBucket {
  int64 start_time = 1;
  int32 count = 2;
}

message GetSecuritybotResolutionStatsRequest {
  optional string automation_id = 1;
  optional int32 team_id = 2;
}

message GetSecuritybotResolutionStatsResponse {
  uint32 vulnerabilities_count = 1;
  uint32 fixed_count = 2;
  uint32 automation_count = 3;
}

message CancelAutomationRunRequest {
  string background_composer_id = 1;
}

message CancelAutomationRunResponse {
  bool success = 1;
  string message = 2;
}

message CancelAllAutomationRunsRequest {
  string automation_id = 1;
}

message CancelAllAutomationRunsResponse {
  int32 cancelled_count = 1;
  string message = 2;
}

message RetryAutomationRunRequest {
  string run_uuid = 1;
}

message RetryAutomationRunResponse {
  string background_composer_id = 1;
  string run_uuid = 2;
}

message WorkflowTemplate {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  Workflow workflow = 5;
  InputSchema input_schema = 6;
  string icon = 7;
  optional int32 featured_index = 8;
  repeated McpTemplateHint mcp_hints = 9;
}

message McpTemplateHint {
  string name = 1;
  optional string url = 2;
}

message InputSchema {
  repeated InputField fields = 1;
}

message InputField {
  string key = 1;
  string display_name = 2;
  string description = 3;
  oneof type {
    string string_value = 4;
    StringList string_list_value = 5;
    bool bool_value = 6;
  }
}

message StringList {
  repeated string values = 1;
}

message InputValues {
  repeated InputValue values = 1;
}

message InputValue {
  string key = 1;
  oneof value {
    string string_value = 2;
    StringList string_list_value = 3;
    bool bool_value = 4;
  }
}

message ListWorkflowTemplatesRequest {
  optional string category = 1;
}

message ListWorkflowTemplatesResponse {
  repeated WorkflowTemplate templates = 1;
}

message GetWorkflowTemplateRequest {
  string template_id = 1;
}

message GetWorkflowTemplateResponse {
  WorkflowTemplate template = 1;
}

message CreateWorkflowFromTemplateRequest {
  string template_id = 1;
  string name = 2;
  InputValues input_values = 3;
  optional string description = 4;
  AutomationCreationSource creation_source = 5;
}

message CreateWorkflowFromTemplateResponse {
  Automation workflow = 1;
}

message ValidateAutomationToolsRequest {
  string prompt = 1;
  repeated string trigger_types = 2;
}

message ValidateAutomationToolsResponse {
  repeated ToolSuggestion suggestions = 1;
}

message ToolSuggestion {
  string slug = 1;
  string label = 2;
  repeated string evidence = 3;
  string config_note = 4;
}

message BuilderCompletionMessage {
  string role = 1;
  string content = 2;
}

message BuilderCompletionContext {
  string stage = 1;
  string current_config_json = 2;
  bool github_connected = 3;
  bool slack_connected = 4;
  bool linear_connected = 5;
  bool pagerduty_connected = 6;
  bool microsoft_teams_connected = 7;
}

message BuilderCompletionRequest {
  repeated BuilderCompletionMessage messages = 1;
  BuilderCompletionContext context = 2;
}

message BuilderCompletionResponse {
  string content = 1;
}

message DisableAutomationForTeamShutdownRequest {
  int32 team_id = 1;
  string automation_id = 2;
}

message DisableAutomationForTeamShutdownResponse {
}

message GetSentryAuthUrlRequest {
}

message GetSentryAuthUrlResponse {
  string install_url = 1;
  string csrf_token = 2;
}

message ConnectSentryCallbackRequest {
  string code = 1;
  string installation_id = 2;
  string state = 3;
  optional string organization_slug = 4;
}

message ConnectSentryCallbackResponse {
  bool success = 1;
}

message GetSentryStatusRequest {
}

message GetSentryStatusResponse {
  bool is_connected = 1;
  optional string organization_slug = 2;
}

message GetSentryProjectsRequest {
}

message SentryProject {
  string id = 1;
  string slug = 2;
  string name = 3;
}

message GetSentryProjectsResponse {
  repeated SentryProject projects = 1;
  optional string organization_slug = 2;
}

message DisconnectSentryRequest {
}

message DisconnectSentryResponse {
  bool success = 1;
}

service AutomationsService {
  rpc CreateAutomation(CreateAutomationRequest) returns (CreateAutomationResponse);
  rpc ListAutomations(ListAutomationsRequest) returns (ListAutomationsResponse);
  rpc GetAutomation(GetAutomationRequest) returns (GetAutomationResponse);
  rpc UpdateAutomation(UpdateAutomationRequest) returns (UpdateAutomationResponse);
  rpc UpdateAutomationAuthoringMode(UpdateAutomationAuthoringModeRequest) returns (UpdateAutomationAuthoringModeResponse);
  rpc ValidateAutomationSpec(ValidateAutomationSpecRequest) returns (ValidateAutomationSpecResponse);
  rpc ApplyAutomationSpec(ApplyAutomationSpecRequest) returns (ApplyAutomationSpecResponse);
  rpc DeleteAutomation(DeleteAutomationRequest) returns (DeleteAutomationResponse);
  rpc TestAutomation(TestAutomationRequest) returns (TestAutomationResponse);
  rpc TestAutomationFilter(TestAutomationFilterRequest) returns (TestAutomationFilterResponse);
  rpc ListAutomationRuns(ListAutomationRunsRequest) returns (ListAutomationRunsResponse);
  rpc GetAutomationRun(GetAutomationRunRequest) returns (GetAutomationRunResponse);
  rpc ListAllRuns(ListAllRunsRequest) returns (ListAllRunsResponse);
  rpc GetRunSummary(GetRunSummaryRequest) returns (GetRunSummaryResponse);
  rpc GetSecuritybotResolutionStats(GetSecuritybotResolutionStatsRequest) returns (GetSecuritybotResolutionStatsResponse);
  rpc CancelAutomationRun(CancelAutomationRunRequest) returns (CancelAutomationRunResponse);
  rpc CancelAllAutomationRuns(CancelAllAutomationRunsRequest) returns (CancelAllAutomationRunsResponse);
  rpc RetryAutomationRun(RetryAutomationRunRequest) returns (RetryAutomationRunResponse);
  rpc ListAutomationMemories(ListAutomationMemoriesRequest) returns (ListAutomationMemoriesResponse);
  rpc GetAutomationMemory(GetAutomationMemoryRequest) returns (GetAutomationMemoryResponse);
  rpc UpdateAutomationMemory(UpdateAutomationMemoryRequest) returns (UpdateAutomationMemoryResponse);
  rpc ListWorkflowTemplates(ListWorkflowTemplatesRequest) returns (ListWorkflowTemplatesResponse);
  rpc GetWorkflowTemplate(GetWorkflowTemplateRequest) returns (GetWorkflowTemplateResponse);
  rpc CreateWorkflowFromTemplate(CreateWorkflowFromTemplateRequest) returns (CreateWorkflowFromTemplateResponse);
  rpc ValidateAutomationTools(ValidateAutomationToolsRequest) returns (ValidateAutomationToolsResponse);
  rpc BuilderCompletion(BuilderCompletionRequest) returns (BuilderCompletionResponse);
  rpc DisableAutomationForTeamShutdown(DisableAutomationForTeamShutdownRequest) returns (DisableAutomationForTeamShutdownResponse);
  rpc GetSentryAuthUrl(GetSentryAuthUrlRequest) returns (GetSentryAuthUrlResponse);
  rpc ConnectSentryCallback(ConnectSentryCallbackRequest) returns (ConnectSentryCallbackResponse);
  rpc GetSentryStatus(GetSentryStatusRequest) returns (GetSentryStatusResponse);
  rpc GetSentryProjects(GetSentryProjectsRequest) returns (GetSentryProjectsResponse);
  rpc DisconnectSentry(DisconnectSentryRequest) returns (DisconnectSentryResponse);
}
