syntax = "proto3";

package aiserver.v1;

import "agent/v1/agent_skills.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum FullSelfDrivingMode {
  FULL_SELF_DRIVING_MODE_UNSPECIFIED = 0;
  FULL_SELF_DRIVING_MODE_SUGGEST = 1;
  FULL_SELF_DRIVING_MODE_APPLY = 2;
}

enum FullSelfDrivingRunSuggestionState {
  FULL_SELF_DRIVING_RUN_SUGGESTION_STATE_UNSPECIFIED = 0;
  FULL_SELF_DRIVING_RUN_SUGGESTION_STATE_RUNNING = 1;
  FULL_SELF_DRIVING_RUN_SUGGESTION_STATE_NO_CHANGES = 2;
  FULL_SELF_DRIVING_RUN_SUGGESTION_STATE_READY = 3;
  FULL_SELF_DRIVING_RUN_SUGGESTION_STATE_NOT_SUGGEST_MODE = 4;
}

enum FullSelfDrivingCloudCommandAction {
  FULL_SELF_DRIVING_CLOUD_COMMAND_ACTION_UNSPECIFIED = 0;
  FULL_SELF_DRIVING_CLOUD_COMMAND_ACTION_SPAWNED = 1;
  FULL_SELF_DRIVING_CLOUD_COMMAND_ACTION_FOLLOWED_UP = 2;
}

message SetFullSelfDrivingConfigRequest {
  string pr_url = 1;
  bool enabled = 2;
  FullSelfDrivingMode mode = 3;
}

message SetFullSelfDrivingConfigResponse {
  bool enabled = 1;
  FullSelfDrivingMode mode = 2;
  string spawned_bc_id = 3;
  bool auto_started = 4;
}

message GetFullSelfDrivingConfigRequest {
  string pr_url = 1;
}

message GetFullSelfDrivingConfigResponse {
  bool has_config = 1;
  bool enabled = 2;
  FullSelfDrivingMode mode = 3;
  bool auto_started = 4;
}

message ListFullSelfDrivingRunsRequest {
  string pr_url = 1;
  optional int32 limit = 2;
}

message FullSelfDrivingRunLiveStatus {
  string state = 1;
  string status = 2;
  repeated string loading_messages = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message FullSelfDrivingRun {
  string bc_id = 1;
  string status = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp first_finished_at = 4;
  string branch_name = 5;
  bool auto_branch = 6;
  int32 files_changed = 7;
  string source = 8;
  string active_run_id = 9;
  optional FullSelfDrivingRunLiveStatus latest_status_update = 10;
}

message ListFullSelfDrivingRunsResponse {
  repeated FullSelfDrivingRun runs = 1;
}

message ListFullSelfDrivingFindingsRequest {
  string pr_url = 1;
  string bc_id = 2;
  optional int32 limit = 3;
  bool include_superseded = 4;
  repeated string kinds = 5;
}

message FullSelfDrivingFinding {
  string event_id = 1;
  google.protobuf.Timestamp last_updated_at = 2;
  string pr_url = 3;
  string bc_id = 4;
  string stable_key = 5;
  string status = 6;
  string title = 7;
  string body = 8;
  string severity = 9;
  google.protobuf.Struct payload = 10;
  string superseded_by_stable_key = 11;
  string superseded_reason = 12;
  string dismissed_reason = 13;
  string kind = 14;
  string action = 15;
  string dedupe_key = 16;
}

message ListFullSelfDrivingFindingsResponse {
  repeated FullSelfDrivingFinding findings = 1;
}

message FullSelfDrivingOutputInput {
  string stable_key = 1;
  string kind = 2;
  string status = 3;
  string title = 4;
  string body = 5;
  string severity = 6;
  string action = 7;
  google.protobuf.Struct payload = 8;
}

message RecordFullSelfDrivingOutputsRequest {
  string pr_url = 1;
  string bc_id = 2;
  repeated FullSelfDrivingOutputInput outputs = 3;
}

message RecordFullSelfDrivingOutputsResponse {
  repeated FullSelfDrivingFinding findings = 1;
}

message UpdateFullSelfDrivingOutputRequest {
  string pr_url = 1;
  string bc_id = 2;
  string stable_key = 3;
  optional string title = 4;
  optional string body = 5;
  optional string status = 6;
  optional string severity = 7;
  optional bool clear_severity = 8;
  optional string action = 9;
  optional bool clear_action = 10;
  google.protobuf.Struct payload = 11;
}

message UpdateFullSelfDrivingOutputResponse {
  FullSelfDrivingFinding finding = 1;
}

message SupersedeFullSelfDrivingOutputRequest {
  string pr_url = 1;
  string bc_id = 2;
  string stable_key = 3;
  optional string replacement_stable_key = 4;
  optional string reason = 5;
}

message SupersedeFullSelfDrivingOutputResponse {
  FullSelfDrivingFinding finding = 1;
}

message DismissFullSelfDrivingOutputRequest {
  string pr_url = 1;
  string bc_id = 2;
  string stable_key = 3;
  optional string reason = 4;
}

message DismissFullSelfDrivingOutputResponse {
  FullSelfDrivingFinding finding = 1;
}

message UndoFullSelfDrivingOutputRequest {
  string pr_url = 1;
  string bc_id = 2;
  string stable_key = 3;
}

message UndoFullSelfDrivingOutputResponse {
  FullSelfDrivingFinding finding = 1;
}

message GetFullSelfDrivingRunSuggestionRequest {
  string pr_url = 1;
  string bc_id = 2;
}

message GetFullSelfDrivingRunSuggestionResponse {
  FullSelfDrivingRunSuggestionState state = 1;
  string side_branch_name = 2;
  string head_commit_sha = 3;
  string base_commit_sha = 4;
  string create_pr_url = 5;
  bool already_applied = 6;
}

message ApplyFullSelfDrivingSuggestionRequest {
  string pr_url = 1;
  string bc_id = 2;
  string head_commit_sha = 3;
  string stable_key = 4;
}

message ApplyFullSelfDrivingSuggestionResponse {
  string new_pr_head_sha = 1;
}

message UpdateFullSelfDrivingFindingStatusRequest {
  string pr_url = 1;
  string bc_id = 2;
  string stable_key = 3;
  string status = 4;
}

message UpdateFullSelfDrivingFindingStatusResponse {
  FullSelfDrivingFinding finding = 1;
}

message RunFullSelfDrivingWorkflowSuggestionRequest {
  string pr_url = 1;
  string bc_id = 2;
  string stable_key = 3;
  string event_id = 4;
}

message RunFullSelfDrivingWorkflowSuggestionResponse {
  string bc_id = 1;
  bool spawned_new_run = 2;
}

message BuildFullSelfDrivingTriageContextRequest {
  string pr_url = 1;
  string trigger_description = 2;
  optional string event_name = 3;
  FullSelfDrivingMode mode = 4;
  optional string bc_id = 5;
  bool fetch_ci_log_excerpts = 6;
}

message BuildFullSelfDrivingTriageContextResponse {
  string triage_json = 1;
}

message PrepareLocalFullSelfDrivingRunRequest {
  string pr_url = 1;
  FullSelfDrivingMode mode = 2;
  optional string trigger_description = 3;
  optional string model_id = 4;
}

message PrepareLocalFullSelfDrivingRunResponse {
  string local_run_id = 1;
  string prompt = 2;
  string triage_context_json = 3;
  FullSelfDrivingMode mode = 4;
  string model_id = 5;
  repeated string skill_ids = 6;
  repeated agent.v1.AgentSkill skills = 7;
}

message RunFullSelfDrivingCloudCommandRequest {
  string pr_url = 1;
  FullSelfDrivingMode mode = 2;
  optional string user_instructions = 3;
  optional string trigger_description = 4;
  optional string model_id = 5;
}

message RunFullSelfDrivingCloudCommandResponse {
  string bc_id = 1;
  FullSelfDrivingCloudCommandAction action = 2;
  FullSelfDrivingMode mode = 3;
}

message EnrollExternalFullSelfDrivingRunRequest {
  string pr_url = 1;
  string bc_id = 2;
  FullSelfDrivingMode mode = 3;
  bool enable_config = 4;
}

message EnrollExternalFullSelfDrivingRunResponse {
  bool enrolled = 1;
}

message FullSelfDrivingPrScopedSuggestion {
  FullSelfDrivingFinding finding = 1;
  string producer = 2;
  string producer_run_id = 3;
  int64 created_by_user_id = 4;
  optional int64 created_by_team_id = 5;
}

message RecordFullSelfDrivingPrScopedSuggestionRequest {
  string pr_url = 1;
  string producer = 2;
  string producer_run_id = 3;
  FullSelfDrivingOutputInput output = 4;
}

message RecordFullSelfDrivingPrScopedSuggestionResponse {
  FullSelfDrivingPrScopedSuggestion suggestion = 1;
}

message ListFullSelfDrivingPrScopedSuggestionsRequest {
  string pr_url = 1;
  optional int32 limit = 2;
  bool include_superseded = 3;
  repeated string kinds = 4;
}

message ListFullSelfDrivingPrScopedSuggestionsResponse {
  repeated FullSelfDrivingPrScopedSuggestion suggestions = 1;
}

message UpdateFullSelfDrivingPrScopedSuggestionStatusRequest {
  string pr_url = 1;
  string stable_key = 2;
  string status = 3;
  optional string reason = 4;
}

message UpdateFullSelfDrivingPrScopedSuggestionStatusResponse {
  FullSelfDrivingPrScopedSuggestion suggestion = 1;
}

message ApplyFullSelfDrivingPrScopedSuggestionRequest {
  string pr_url = 1;
  string stable_key = 2;
  string head_commit_sha = 3;
  string event_id = 4;
}

message ApplyFullSelfDrivingPrScopedSuggestionResponse {
  string new_pr_head_sha = 1;
  FullSelfDrivingPrScopedSuggestion suggestion = 2;
}

message FullSelfDrivingAutoApplyConfig {
  string match_kind = 1;
  string match_key = 2;
  string scope = 3;
  string repo_owner = 4;
  string repo_name = 5;
  google.protobuf.Timestamp created_at = 6;
}

message RecordFullSelfDrivingAutoApplyConfigRequest {
  string match_kind = 1;
  string match_key = 2;
  string scope = 3;
  string repo_owner = 4;
  string repo_name = 5;
}

message RecordFullSelfDrivingAutoApplyConfigResponse {
  FullSelfDrivingAutoApplyConfig config = 1;
}

message DeleteFullSelfDrivingAutoApplyConfigRequest {
  string match_kind = 1;
  string match_key = 2;
  string scope = 3;
  string repo_owner = 4;
  string repo_name = 5;
}

message DeleteFullSelfDrivingAutoApplyConfigResponse {
  bool deleted = 1;
}

message ListFullSelfDrivingAutoApplyConfigsRequest {
  optional string repo_owner = 1;
  optional string repo_name = 2;
}

message ListFullSelfDrivingAutoApplyConfigsResponse {
  repeated FullSelfDrivingAutoApplyConfig configs = 1;
}

service FullSelfDrivingService {
  rpc SetFullSelfDrivingConfig(SetFullSelfDrivingConfigRequest) returns (SetFullSelfDrivingConfigResponse);
  rpc GetFullSelfDrivingConfig(GetFullSelfDrivingConfigRequest) returns (GetFullSelfDrivingConfigResponse);
  rpc ListFullSelfDrivingRuns(ListFullSelfDrivingRunsRequest) returns (ListFullSelfDrivingRunsResponse);
  rpc GetFullSelfDrivingRunSuggestion(GetFullSelfDrivingRunSuggestionRequest) returns (GetFullSelfDrivingRunSuggestionResponse);
  rpc ApplyFullSelfDrivingSuggestion(ApplyFullSelfDrivingSuggestionRequest) returns (ApplyFullSelfDrivingSuggestionResponse);
  rpc ListFullSelfDrivingFindings(ListFullSelfDrivingFindingsRequest) returns (ListFullSelfDrivingFindingsResponse);
  rpc RecordFullSelfDrivingOutputs(RecordFullSelfDrivingOutputsRequest) returns (RecordFullSelfDrivingOutputsResponse);
  rpc UpdateFullSelfDrivingOutput(UpdateFullSelfDrivingOutputRequest) returns (UpdateFullSelfDrivingOutputResponse);
  rpc SupersedeFullSelfDrivingOutput(SupersedeFullSelfDrivingOutputRequest) returns (SupersedeFullSelfDrivingOutputResponse);
  rpc DismissFullSelfDrivingOutput(DismissFullSelfDrivingOutputRequest) returns (DismissFullSelfDrivingOutputResponse);
  rpc UndoFullSelfDrivingOutput(UndoFullSelfDrivingOutputRequest) returns (UndoFullSelfDrivingOutputResponse);
  rpc UpdateFullSelfDrivingFindingStatus(UpdateFullSelfDrivingFindingStatusRequest) returns (UpdateFullSelfDrivingFindingStatusResponse);
  rpc RunFullSelfDrivingWorkflowSuggestion(RunFullSelfDrivingWorkflowSuggestionRequest) returns (RunFullSelfDrivingWorkflowSuggestionResponse);
  rpc BuildFullSelfDrivingTriageContext(BuildFullSelfDrivingTriageContextRequest) returns (BuildFullSelfDrivingTriageContextResponse);
  rpc PrepareLocalFullSelfDrivingRun(PrepareLocalFullSelfDrivingRunRequest) returns (PrepareLocalFullSelfDrivingRunResponse);
  rpc RunFullSelfDrivingCloudCommand(RunFullSelfDrivingCloudCommandRequest) returns (RunFullSelfDrivingCloudCommandResponse);
  rpc EnrollExternalFullSelfDrivingRun(EnrollExternalFullSelfDrivingRunRequest) returns (EnrollExternalFullSelfDrivingRunResponse);
  rpc ListFullSelfDrivingPrScopedSuggestions(ListFullSelfDrivingPrScopedSuggestionsRequest) returns (ListFullSelfDrivingPrScopedSuggestionsResponse);
  rpc RecordFullSelfDrivingPrScopedSuggestion(RecordFullSelfDrivingPrScopedSuggestionRequest) returns (RecordFullSelfDrivingPrScopedSuggestionResponse);
  rpc UpdateFullSelfDrivingPrScopedSuggestionStatus(UpdateFullSelfDrivingPrScopedSuggestionStatusRequest) returns (UpdateFullSelfDrivingPrScopedSuggestionStatusResponse);
  rpc ApplyFullSelfDrivingPrScopedSuggestion(ApplyFullSelfDrivingPrScopedSuggestionRequest) returns (ApplyFullSelfDrivingPrScopedSuggestionResponse);
  rpc RecordFullSelfDrivingAutoApplyConfig(RecordFullSelfDrivingAutoApplyConfigRequest) returns (RecordFullSelfDrivingAutoApplyConfigResponse);
  rpc DeleteFullSelfDrivingAutoApplyConfig(DeleteFullSelfDrivingAutoApplyConfigRequest) returns (DeleteFullSelfDrivingAutoApplyConfigResponse);
  rpc ListFullSelfDrivingAutoApplyConfigs(ListFullSelfDrivingAutoApplyConfigsRequest) returns (ListFullSelfDrivingAutoApplyConfigsResponse);
}
