syntax = "proto3";

package aiserver.v1;

enum RateLimitReason {
  RATE_LIMIT_REASON_UNSPECIFIED = 0;
  RATE_LIMIT_REASON_TIMEOUT = 1;
  RATE_LIMIT_REASON_NO_BUDGET = 2;
  RATE_LIMIT_REASON_WORKLOAD_BLOCKED = 3;
  RATE_LIMIT_REASON_QUEUE_FULL = 4;
  RATE_LIMIT_REASON_CONNECTION_ERROR = 5;
  RATE_LIMIT_REASON_DEPLOYMENT_DISABLED = 6;
}

enum ProviderErrorType {
  PROVIDER_ERROR_TYPE_UNSPECIFIED = 0;
  PROVIDER_ERROR_TYPE_RATE_LIMIT = 1;
  PROVIDER_ERROR_TYPE_SERVER = 2;
  PROVIDER_ERROR_TYPE_TIMEOUT = 3;
}

message AcquireRequest {
  string provider = 1;
  string deployment = 2;
  string workload_id = 3;
  string conversation_id = 4;
  int64 timeout_ms = 5;
  string model = 6;
  string conversation_group_id = 7;
}

message AcquireResponse {
  bool granted = 1;
  RateLimitReason reason = 2;
  int32 replay_count = 3;
}

message ReportUsageRequest {
  string provider = 1;
  string deployment = 2;
  string workload_id = 3;
  string conversation_id = 4;
  int64 input_tokens = 5;
  int64 output_tokens = 6;
  int64 total_tokens = 7;
  bool success = 8;
  int64 duration_ms = 9;
  string model = 10;
  ProviderErrorType provider_error_type = 11;
  string conversation_group_id = 12;
}

message ReportUsageResponse {
}

service SchedulerService {
  rpc Acquire(AcquireRequest) returns (AcquireResponse);
  rpc ReportUsage(ReportUsageRequest) returns (ReportUsageResponse);
}
