syntax = "proto3";

package aiserver.v1;

message GetPublicIpRequest {
}

message GetPublicIpResponse {
  string ip = 1;
}

message IsConnectedRequest {
}

message IsConnectedResponse {
}

service NetworkService {
  rpc GetPublicIp (GetPublicIpRequest) returns (GetPublicIpResponse);
  rpc IsConnected (IsConnectedRequest) returns (IsConnectedResponse);
}
